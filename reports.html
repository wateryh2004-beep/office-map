<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云端资料库 | Colliers</title>
    <style>
        body { font-family: "Segoe UI", sans-serif; background: #f4f6f9; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; color: #333; }
        
        .header { background: #003E7E; color: white; padding: 0 25px; height: 50px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .header h1 { margin: 0; font-size: 16px; font-weight: 600; }
        .back-link { color: rgba(255,255,255,0.8); text-decoration: none; font-size: 13px; }
        .back-link:hover { color: white; }
        
        .container { flex: 1; display: flex; flex-direction: column; overflow: hidden; max-width: 1000px; width: 100%; margin: 0 auto; padding: 20px; box-sizing: border-box; }

        /* 极简二选一卡片 */
        .lang-grid { display: flex; justify-content: center; gap: 40px; margin-top: 10vh; }
        .lang-card { background: white; border-radius: 4px; width: 280px; padding: 50px 20px; text-align: center; cursor: pointer; border: 1px solid #e0e0e0; transition: 0.2s; }
        .lang-card:hover { transform: translateY(-3px); border-color: #003E7E; box-shadow: 0 4px 15px rgba(0,62,126,0.08); }
        .lang-icon { font-size: 50px; margin-bottom: 20px; color: #003E7E; }
        .lang-title { font-size: 18px; font-weight: 600; color: #333; margin-bottom: 5px; }
        .lang-desc { font-size: 12px; color: #888; }

        /* 列表区域头部 */
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-shrink: 0; }
        .breadcrumb { font-size: 13px; color: #555; display: flex; align-items: center; gap: 8px; }
        .breadcrumb span { cursor: pointer; color: #003E7E; font-weight: 500; }
        .breadcrumb span:hover { text-decoration: underline; }
        .search-input { padding: 8px 12px; border: 1px solid #ccc; border-radius: 2px; font-size: 12px; width: 220px; outline: none; }
        .search-input:focus { border-color: #003E7E; }

        /* 内部滚动表格 */
        .table-container { flex: 1; background: white; border-radius: 2px; border: 1px solid #e0e0e0; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: #fafafa; color: #555; padding: 12px 20px; border-bottom: 1px solid #eee; text-align: left; position: sticky; top: 0; z-index: 10; }
        td { padding: 12px 20px; border-bottom: 1px solid #eee; color: #444; }
        tr:hover td { background: #f8f9fa; }
        
        .btn-download { display: inline-block; background: white; border: 1px solid #003E7E; color: #003E7E; padding: 4px 12px; border-radius: 2px; text-decoration: none; font-size: 12px; transition: 0.2s; }
        .btn-download:hover { background: #003E7E; color: white; }
        .status-message { text-align: center; padding: 40px; color: #888; font-size: 13px; }
    </style>
</head>
<body>

<div class="header">
    <h1>📚 内部资料库</h1>
    <a href="index.html" class="back-link">返回门户大厅</a>
</div>

<div class="container">
    
    <div class="lang-grid" id="lang-view" style="display: none;">
        <div class="lang-card" onclick="fetchReports('一线城市/')">
            <div class="lang-icon">🏢</div>
            <div class="lang-title">一线城市报告</div>
            <div class="lang-desc">Tier 1 Cities</div>
        </div>
        <div class="lang-card" onclick="fetchReports('二线城市/')">
            <div class="lang-icon">🏙️</div>
            <div class="lang-title">二线城市报告</div>
            <div class="lang-desc">Tier 2 Cities</div>
        </div>
    </div>

    <div id="folder-view" style="display: none; flex: 1; display: flex; flex-direction: column; overflow: hidden;">
        <div class="toolbar">
            <div class="breadcrumb" id="breadcrumb">
                <span onclick="fetchReports('')">🏠 返回外层</span>
            </div>
            <input type="text" id="searchInput" class="search-input" placeholder="输入关键词过滤..." onkeyup="filterCurrentView()">
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 55%;">名称</th>
                        <th style="width: 15%;">大小</th>
                        <th style="width: 15%;">更新日期</th>
                        <th style="width: 15%; text-align: center;">操作</th>
                    </tr>
                </thead>
                <tbody id="report-list">
                    <tr><td colspan="4"><div class="status-message">连接云端中...</div></td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let currentPrefix = '';
    let currentData = [];

    window.onload = function() {
        const userStr = localStorage.getItem('colliers_user');
        if (!userStr) { window.location.href = 'index.html'; return; }
        fetchReports(''); 
    };

    async function fetchReports(prefix) {
        currentPrefix = prefix || '';
        const langView = document.getElementById('lang-view');
        const folderView = document.getElementById('folder-view');

        if (!currentPrefix) {
            langView.style.display = 'flex'; folderView.style.display = 'none'; return;
        }

        langView.style.display = 'none'; folderView.style.display = 'flex';
        document.getElementById('searchInput').value = ''; 
        document.getElementById('report-list').innerHTML = `<tr><td colspan="4" class="status-message">加载中...</td></tr>`;
        
        try {
            // 中文字符将被自动进行 encodeURIComponent 编码，完美适配阿里云接口
            const url = `/api/oss?action=get-list&prefix=${encodeURIComponent(currentPrefix)}`;
            const res = await fetch(url);
            const result = JSON.parse(await res.text());
            if (res.ok && result.status === 'success') {
                currentData = result.data || [];
                renderBreadcrumb(); renderTable(currentData);
            } else { throw new Error(result.message); }
        } catch (e) { 
            document.getElementById('report-list').innerHTML = `<tr><td colspan="4" class="status-message" style="color:red;">加载失败</td></tr>`; 
        }
    }

    function renderBreadcrumb() {
        const bc = document.getElementById('breadcrumb');
        let html = `<span onclick="fetchReports('')">🏠 首页</span>`;
        if (currentPrefix) {
            const parts = currentPrefix.split('/').filter(p => p);
            let path = '';
            parts.forEach((p) => { path += p + '/'; html += ` <span style="color:#ccc; cursor:default; text-decoration:none;">/</span> <span onclick="fetchReports('${path}')">${p}</span>`; });
        }
        bc.innerHTML = html;
    }

    function renderTable(dataList) {
        const tbody = document.getElementById('report-list');
        if (!dataList || dataList.length === 0) {
            tbody.innerHTML = (currentPrefix ? `<tr style="cursor:pointer;" onclick="goUp()"><td colspan="4" style="color:#003E7E; font-weight:bold;">🔙 返回上层</td></tr>` : '') + `<tr><td colspan="4" class="status-message">当前目录为空</td></tr>`;
            return;
        }
        let html = currentPrefix ? `<tr style="cursor:pointer;" onclick="goUp()"><td colspan="4" style="color:#003E7E; font-weight:bold;">🔙 返回上层</td></tr>` : '';
        html += dataList.map(item => {
            if (item.type === 'folder') {
                const name = item.name.replace(currentPrefix, '').replace(/\//g, '');
                return `<tr style="cursor:pointer;" onclick="fetchReports('${item.name}')"><td style="font-weight:bold; color:#333;">📁 ${name}</td><td style="color:#aaa;">-</td><td style="color:#aaa;">-</td><td style="text-align:center; color:#aaa;">进入</td></tr>`;
            } else {
                const date = item.lastModified ? item.lastModified.split('T')[0] : '-';
                return `<tr><td style="color:#003E7E;">📄 ${item.shortName || '未知'}</td><td style="color:#888;">${item.size||'-'}</td><td style="color:#888;">${date}</td><td style="text-align:center;"><a href="${item.url}" class="btn-download" target="_blank">下载</a></td></tr>`;
            }
        }).join('');
        tbody.innerHTML = html;
    }

    function goUp() {
        const parts = currentPrefix.split('/').filter(p => p);
        parts.pop(); fetchReports(parts.length > 0 ? parts.join('/') + '/' : '');
    }

    function filterCurrentView() {
        const kw = document.getElementById('searchInput').value.trim().toLowerCase();
        renderTable(currentData.filter(item => (item.type === 'folder' ? item.name : item.shortName).toLowerCase().includes(kw)));
    }
</script>
</body>
</html>
