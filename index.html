    <style>
        /* --- 布局样式 --- */
        body { margin: 0; padding: 0; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; overflow: hidden; display: flex; height: 100vh; background: #f0f2f5; }
        
        /* 左侧边栏 */
        #sidebar {
            width: 350px;
            background: #fff;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            z-index: 200;
            box-shadow: 4px 0 15px rgba(0,0,0,0.05);
        }
        
        .brand-header {
            padding: 20px;
            background: #004080; /* Colliers Blue */
            color: white;
        }
        .brand-header h2 { margin: 0; font-size: 20px; font-weight: 700; }
        .brand-header p { margin: 5px 0 0; opacity: 0.8; font-size: 12px; }

        /* 统计卡片区 */
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 15px;
            background: #f8f9fa;
            border-bottom: 1px solid #eee;
        }
        .stat-card { 
            background: #fff; padding: 10px; border-radius: 6px; text-align: center; 
            border: 1px solid #eee;
        }
        .stat-value { font-size: 16px; font-weight: 800; color: #004080; margin-bottom: 2px; }
        .stat-label { font-size: 11px; color: #888; }

        /* 控制区 */
        .controls { flex: 1; padding: 15px; overflow-y: auto; }
        .control-group { margin-bottom: 20px; }
        .control-title { font-weight: bold; font-size: 13px; margin-bottom: 8px; display: block; color: #333; }
        
        /* 搜索组合框 */
        .search-box { display: flex; gap: 5px; margin-bottom: 20px; }
        #search-input {
            flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px;
            font-size: 14px; outline: none;
        }
        #search-btn {
            padding: 0 15px; background: #004080; color: white; border: none; border-radius: 4px;
            cursor: pointer; font-weight: bold; font-size: 13px;
        }
        #search-btn:hover { background: #003366; }

        /* 复选框 */
        .checkbox-group label {
            display: flex; align-items: center; margin-bottom: 8px; font-size: 13px; color: #555; cursor: pointer;
        }
        .checkbox-group input { margin-right: 8px; }

        /* 底部模式切换 */
        .actions { padding: 15px; border-top: 1px solid #eee; background: white; }
        .btn-mode {
            width: 100%; padding: 10px; margin-bottom: 5px;
            border: 1px solid #e0e0e0; background: white; color: #555;
            border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 13px;
            transition: all 0.2s; text-align: left;
        }
        .btn-mode.active { background: #e6f0fa; color: #004080; border-color: #004080; }

        /* 地图区 */
        #map-container { flex: 1; position: relative; }
        
        /* 状态条 */
        #status-bar {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: rgba(0,0,0,0.8); color: white; padding: 10px 20px;
            border-radius: 30px; font-size: 13px; display: none;
        }

        /* 弹窗样式 */
        .info-window-card { width: 340px; font-family: sans-serif; }
        .chart-container { height: 200px; width: 100%; margin-top: 15px; }
        .trend-tag { padding: 2px 6px; border-radius: 4px; font-size: 12px; margin-left: 6px; font-weight: bold; }
        .trend-up { background: #ffebee; color: #c62828; }
        .trend-down { background: #e8f5e9; color: #2e7d32; } 
    </style>
</head>
