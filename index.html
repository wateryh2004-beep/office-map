<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colliers Office 3D Map</title>
    
    <script src="./xlsx.full.min.js"></script>
    
    <script type="text/javascript">
        window._AMapSecurityConfig = {
            securityJsCode: '', 
        }
    </script>
    <script src="https://webapi.amap.com/maps?v=2.0&key=31fdd14ad134becab8cb33119fa019d5"></script>
    
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: "Microsoft YaHei", sans-serif; }
        
        #container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

        /* 修复核心：Z-Index 设为 9999，背景设为白色确保可见 */
        #search-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 340px;
            z-index: 9999; /* 强制置顶，压倒地图 */
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        h3 { margin: 0 0 15px 0; color: #333; }

        .search-row { display: flex; gap: 10px; }

        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }

        /* 按钮加了 cursor: pointer 确保鼠标变成手型 */
        button {
            padding: 10px 20px;
            background-color: #007AFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #0056b3; }
        /* 点击时的反馈效果 */
        button:active { background-color: #003366; transform: translateY(2px); }

        #suggestion-list {
            margin-top: 10px;
            border: 1px solid #eee;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }
        .suggestion-item { padding: 10px; border-bottom: 1px solid #f9f9f9; cursor: pointer; }
        .suggestion-item:hover { background: #f0f7ff; color: #007AFF; }
        
        #loading-tip { font-size: 12px; color: #666; margin-top: 8px; text-align: right; }
    </style>
</head>
<body>

<div id="search-panel">
    <h3>Colliers 写字楼地图</h3>
    <div class="search-row">
        <input type="text" id="keyword" placeholder="输入名称..." oninput="handleInput(this.value)" onkeydown="handleEnter(event)">
        <button id="btn-search" onclick="manualSearch()">搜索</button>
    </div>
    <div id="suggestion-list"></div>
    <div id="loading-tip">正在初始化...</div>
</div>

<div id="container"></div>

<script>
    // 调试弹窗：如果打开网页没有这个弹窗，说明 JS 彻底没运行
    console.log("System Starting...");

    // 1. 地图初始化
    const map = new AMap.Map('container', {
        viewMode: '3D',
        pitch: 60,
        zoom: 11,
        center: [116.397428, 39.90923],
        mapStyle: 'amap://styles/fresh',
        showBuildingBlock: true
    });

    // 2. 变量与数据
    let buildings = [];
    const infoWindow = new AMap.InfoWindow({offset: new AMap.Pixel(0, -30)});

    // 3. 读取 Excel
    async function loadExcel() {
        const tip = document.getElementById('loading-tip');
        
        if (typeof XLSX === 'undefined') {
            tip.innerText = "错误：xlsx.full.min.js 未加载";
            tip.style.color = "red";
            return;
        }

        try {
            tip.innerText = "读取 data.xlsx...";
            const response = await fetch('./data.xlsx');
            if (!response.ok) throw new Error("文件不存在");
            
            const buffer = await response.arrayBuffer();
            const workbook = XLSX.read(buffer);
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const json = XLSX.utils.sheet_to_json(sheet);
            
            buildings = json.map(item => {
                const pos = (item.position || "0,0").split(',').map(Number);
                return {
                    name: item.name,
                    position: pos.length===2 ? pos : [0,0],
                    address: item.address || '',
                    price: item.price || '',
                    vacancy: item.vacancy || ''
                };
            });

            initMarkers();
            tip.innerText = `加载成功：${buildings.length} 条`;
            tip.style.color = "green";
        } catch (e) {
            console.error(e);
            tip.innerText = "读取失败 (检查data.xlsx)";
            tip.style.color = "red";
        }
    }

    // 4. 撒点
    function initMarkers() {
        map.clearMap();
        buildings.forEach(item => {
            if (item.position[0] === 0) return;
            const marker = new AMap.Marker({
                position: item.position,
                title: item.name,
                map: map
            });
            marker.on('click', () => { showInfo(item); flyTo(item.position); });
        });
    }

    function showInfo(item) {
        const html = `
            <div style="padding:5px">
                <h4>${item.name}</h4>
                <p>地址：${item.address}</p>
                <p>租金：<b style="color:red">${item.price}</b></p>
                <p>空置：${item.vacancy}</p>
            </div>`;
        infoWindow.setContent(html);
        infoWindow.open(map, item.position);
    }

    // 5. 搜索功能 (核心修复)
    function handleInput(val) {
        const list = document.getElementById('suggestion-list');
        list.innerHTML = '';
        if(!val) { list.style.display='none'; return; }

        const matches = buildings.filter(b => b.name && b.name.includes(val));
        if(matches.length > 0) {
            list.style.display = 'block';
            matches.forEach(item => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                div.innerText = item.name;
                div.onclick = () => { selectBuilding(item); };
                list.appendChild(div);
            });
        } else {
            list.style.display = 'none';
        }
    }

    function handleEnter(e) {
        if(e.key === "Enter") manualSearch();
    }

    function manualSearch() {
        // 测试点击是否有反应
        console.log("Button Clicked!"); 

        const val = document.getElementById('keyword').value;
        if(!val) { alert("请输入内容"); return; }
        
        if(buildings.length === 0) { alert("数据尚未加载完成"); return; }

        const match = buildings.find(b => b.name.includes(val));
        if(match) {
            selectBuilding(match);
        } else {
            alert("未找到: " + val);
        }
    }

    function selectBuilding(item) {
        document.getElementById('keyword').value = item.name;
        document.getElementById('suggestion-list').style.display = 'none';
        flyTo(item.position);
        showInfo(item);
    }

    function flyTo(pos) {
        map.setCamera({ center: pos, zoom: 17, pitch: 60, rotation: 30, duration: 1000 });
    }

    loadExcel();
</script>
</body>
</html>
