            display: flex;
            align-items: center;
            transition: all 0.3s ease;

        .input-group:focus-within {

            outline: none;
            box-sizing: border-box;
            background: #f5f5f7;
            transition: background 0.2s;
        }
        input:focus { background: #fff; border-color: #007AFF; }

        #suggestion-list {

            width: 100%;

            border-radius: 12px;
            margin-top: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            max-height: 300px;
            overflow-y: auto;
            display: none; /* 默认隐藏 */
            padding: 5px 0;
        }

        .suggestion-item {
            padding: 10px 15px;
            cursor: pointer;
            font-size: 14px;
            color: #333;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
        }
        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item:hover { background-color: #f0f7ff; color: #007AFF; }
        .suggestion-sub { font-size: 12px; color: #999; }

        /* --- 加载提示 --- */
        #loading-tip {

            color: #86868b;
            margin-top: 8px;
            text-align: right;
        }

        }
