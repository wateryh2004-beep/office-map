<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高力国际Colliers | 写字楼数据库查询</title>
    
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script type="text/javascript">
        window._AMapSecurityConfig = {
            securityJsCode: '你的安全密钥', // 【请在此处填入你的高德安全密钥】
        }
    </script>
    <script src="https://webapi.amap.com/maps?v=2.0&key=31fdd14ad134becab8cb33119fa019d5"></script>
    
    <style>
        /* --- 样式区 --- */
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; overflow: hidden; display: flex; height: 100vh; background: #f0f2f5; }
        #sidebar { width: 350px; background: #fff; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; z-index: 200; box-shadow: 4px 0 15px rgba(0,0,0,0.05); }
        .brand-header { padding: 20px; background: #004080; color: white; }
        .brand-header h2 { margin: 0; font-size: 20px; font-weight: 700; }
        .brand-header p { margin: 5px 0 0; opacity: 0.8; font-size: 12px; }
        
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; background: #f8f9fa; border-bottom: 1px solid #eee; }
        .stat-card { background: #fff; padding: 10px; border-radius: 6px; text-align: center; border: 1px solid #eee; }
        .stat-value { font-size: 16px; font-weight: 800; color: #004080; margin-bottom: 2px; }
        .stat-label { font-size: 11px; color: #888; }
        
        .controls { flex: 1; padding: 15px; overflow-y: auto; }
        .control-group { margin-bottom: 20px; }
        .control-title { font-weight: bold; font-size: 13px; margin-bottom: 8px; display: block; color: #333; }
        .search-box { display: flex; gap: 5px; margin-bottom: 20px; }
        #search-input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; outline: none; }
        #search-btn { padding: 0 15px; background: #004080; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .checkbox-group label { display: flex; align-items: center; margin-bottom: 8px; font-size: 13px; color: #555; cursor: pointer; }
        .checkbox-group input { margin-right: 8px; }
        
        .actions { padding: 15px; border-top: 1px solid #eee; background: white; }
        .btn-mode { width: 100%; padding: 10px; margin-bottom: 5px; border: 1px solid #e0e0e0; background: white; color: #555; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 13px; transition: all 0.2s; text-align: left; }
        .btn-mode.active { background: #e6f0fa; color: #004080; border-color: #004080; }
        
        #map-container { flex: 1; position: relative; }
        #status-bar { position: absolute; top: 10px; right: 10px; z-index: 1000; background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 30px; font-size: 13px; display: none; }
        
        /* 弹窗与标签 */
        .info-window-card { width: 340px; font-family: sans-serif; }
        .chart-container { height: 160px; width: 100%; margin-top: 10px; }
        .tag-row { display: flex; gap: 5px; margin-top: 6px; }
        .badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; color: white; }
        
        /* 等级颜色 */
        .badge-pa { background: #1a237e; } /* Premium A 深蓝 */
        .badge-a { background: #2979ff; } /* A 亮蓝 */
        .badge-b { background: #40c4ff; } /* B 浅蓝 */
        
        /* LEED 颜色 */
        .badge-platinum { background: #004d40; } /* 铂金 - 深绿 */
        .badge-gold { background: #fbc02d; color: #333; } /* 金 - 金黄 */
        .badge-silver { background: #9e9e9e; color: #333; } /* 银 - 银灰 */
        .badge-none { background: #eeeeee; color: #999; } /* 无 */

        .btn-plan-b { width: 100%; margin-top: 10px; padding: 8px; background: linear-gradient(90deg, #11998e 0%, #38ef7d 100%); border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 5px; box-shadow: 0 4px 10px rgba(56, 239, 125, 0.3); transition: transform 0.1s; }
        .btn-plan-b:active { transform: scale(0.98); }
        .btn-reset { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: white; padding: 10px 20px; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); font-weight: bold; cursor: pointer; z-index: 999; display: none; border: 1px solid #ccc; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="brand-header">
            <h2>COLLIERS DATA</h2>
            <p>办公楼市场监测系统 v5.3</p>
        </div>
        <div class="stat-grid">
            <div class="stat-card"><div class="stat-value" id="stat-count">-</div><div class="stat-label">视野项目</div></div>
            <div class="stat-card"><div class="stat-value" id="stat-price">-</div><div class="stat-label">平均租金</div></div>
            <div class="stat-card"><div class="stat-value" id="stat-grade">-</div><div class="stat-label">A级及以上</div></div>
            <div class="stat-card"><div class="stat-value" id="stat-leed">-</div><div class="stat-label">LEED认证</div></div>
        </div>
        <div class="controls">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="🔍 搜项目名..." onkeydown="if(event.key==='Enter') executeSearch()">
                <button id="search-btn" onclick="executeSearch()">查询</button>
            </div>
            <div class="control-group">
                <span class="control-title">商圈筛选 (Submarket)</span>
                <div class="checkbox-group" id="district-filters"><label>数据加载中...</label></div>
            </div>
        </div>
        <div class="actions">
            <span class="control-title">可视化模式</span>
            <button class="btn-mode active" onclick="setMode('price')">💰 按租金热力着色</button>
            <button class="btn-mode" onclick="setMode('vacancy')">🏢 按空置率着色</button>
            <button class="btn-mode" onclick="setMode('grade')">🏆 按楼宇等级分布</button>
            <button class="btn-mode" onclick="setMode('leed')">🌿 按LEED认证分布</button>
        </div>
    </div>

    <div id="map-container">
        <div id="status-bar"></div>
        <button id="reset-map-btn" class="btn-reset" onclick="resetMapState()">🔄 退出竞品对比模式</button>
    </div>

<script>
    // --- 0. 内置备份数据 (如果 data.xlsx 挂了，用这个，保证不白屏) ---
    const DEMO_DATA = [
        {"Project Name CN": "国贸写字楼1座", "SUBMARKET": "CBD", "grades": "A", "Completion Date": "1990 Q3", "Net Effective Rent": 288.75, "Vacancy Rate": "13.0%", "LEEDS": "", "经纬度": "116.458363,39.909473"},
        {"Project Name CN": "国贸写字楼2座", "SUBMARKET": "CBD", "grades": "A", "Completion Date": "1999 Q4", "Net Effective Rent": 307.08, "Vacancy Rate": "2.0%", "LEEDS": "Gold", "经纬度": "116.460469,39.910838"},
        {"Project Name CN": "测试PA大厦", "SUBMARKET": "丽泽", "grades": "PA", "Completion Date": "2020", "Net Effective Rent": 200, "Vacancy Rate": "5.0%", "LEEDS": "Platinum", "经纬度": "116.336,39.867"}
    ];

    const QUARTERS = ['Q1', 'Q2', 'Q3', 'Q4', 'Next Q1', 'Next Q2'];
    let map, infoWindow, chartInstance;
    let rawData = [], markers = [], circleOverlay = null;
    let activeDistricts = new Set();
    let currentMode = 'price';
    let isCompareMode = false;

    function init() {
        map = new AMap.Map('map-container', { zoom: 11, center: [116.460787, 39.905477], viewMode: '2D', mapStyle: 'amap://styles/whitesmoke' });
        infoWindow = new AMap.InfoWindow({ isCustom: false, offset: new AMap.Pixel(0, -35), autoMove: true }); 
        infoWindow.on('close', () => { if(chartInstance) { chartInstance.destroy(); chartInstance = null; } });
        loadExcel();
    }

    async function loadExcel() {
        showStatus("📥 正在读取数据...");
        let json = [];
        let usedDemo = false;

        try {
            const response = await fetch('./data.xlsx');
            if (response.ok) {
                const buffer = await response.arrayBuffer();
                const workbook = XLSX.read(buffer);
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                json = XLSX.utils.sheet_to_json(sheet);
            } else { throw new Error("File 404"); }
        } catch (err) {
            console.warn("读取失败，启用备份数据");
            json = DEMO_DATA; // ★★★ 自动降级使用内置数据 ★★★
            usedDemo = true;
        }

        processData(json);
        if(usedDemo) showStatus("⚠️ 使用内置备份数据 (请检查 Excel 文件名)");
    }

    // --- ★★★ 智能容错处理 (Fuzzy Matcher) ★★★ ---
    function findVal(item, keys) {
        // 尝试精确匹配
        for (let k of keys) { if (item[k] !== undefined) return item[k]; }
        // 尝试模糊匹配 (去空格、忽略大小写)
        const itemKeys = Object.keys(item);
        for (let k of keys) {
            const match = itemKeys.find(ik => ik.trim().toLowerCase() === k.toLowerCase());
            if (match) return item[match];
        }
        return null;
    }

    function processData(json) {
        rawData = json.map(item => {
            // 1. 坐标 (支持中文或英文列名)
            const posRaw = findVal(item, ['经纬度', 'Position', 'position']);
            const posStr = String(posRaw || "").trim().replace('，', ',');
            const pos = posStr.split(',').map(Number);

            // 2. 基础信息
            const name = findVal(item, ['Project Name CN', 'Project Name EN', 'name']) || "未知项目";
            const district = findVal(item, ['SUBMARKET', '所在区', 'district']) || "其他";
            const built_year = findVal(item, ['Completion Date', 'built_year']) || "-";
            
            // 3. 核心指标
            const pRaw = findVal(item, ['Net Effective Rent', 'price', 'Rent']);
            const pCurrent = parseFloat(pRaw) || 0;
            
            const vRaw = findVal(item, ['Vacancy Rate', 'vacancy']);
            let vCurrent = 0;
            if (typeof vRaw === 'string' && vRaw.includes('%')) vCurrent = parseFloat(vRaw.replace('%', '')) / 100;
            else vCurrent = parseFloat(vRaw) || 0;

            // 4. 等级与LEED (处理 PA, Platinum 等)
            // grades: 可能有空格，转大写
            const gRaw = String(findVal(item, ['grades', 'grade']) || "-").trim().toUpperCase();
            const grade = gRaw === 'PA' ? 'PA' : (gRaw === 'A' ? 'A' : gRaw);

            // LEED: 可能有空格，转首字母大写
            const lRaw = String(findVal(item, ['LEEDS', 'LEED', 'leed']) || "").trim();
            let leed = "无";
            if (lRaw && lRaw !== 'undefined' && lRaw !== 'null') leed = lRaw; // 只要有字就算有

            // 补全历史数据用于画图
            const pHistory = QUARTERS.map(() => pCurrent);
            const vHistory = QUARTERS.map(() => vCurrent);

            return {
                name, district, built_year, grade, leed,
                lat: pos[1], lng: pos[0],
                isValid: (pos.length === 2 && !isNaN(pos[0]) && !isNaN(pos[1])),
                pCurrent, vCurrent, priceHistory: pHistory, vacancyHistory: vHistory, qoq: 0
            };
        }).filter(d => d.isValid);

        if (rawData.length === 0) {
            showStatus("❌ 数据为空，请检查Excel经纬度列");
            return;
        }

        showStatus(`✅ 加载 ${rawData.length} 个项目`);
        initFilters();
        renderMap(rawData);
        setTimeout(() => document.getElementById('status-bar').style.display = 'none', 3000);
    }

    function initFilters() {
        const districts = [...new Set(rawData.map(d => d.district))].sort();
        districts.forEach(d => activeDistricts.add(d));
        document.getElementById('district-filters').innerHTML = districts.map(d => `
            <label><input type="checkbox" value="${d}" checked onchange="toggleDistrict('${d}')">${d}</label>
        `).join('');
    }

    function toggleDistrict(d) {
        if (activeDistricts.has(d)) activeDistricts.delete(d); else activeDistricts.add(d);
        if (!isCompareMode) renderMap(rawData.filter(item => activeDistricts.has(item.district)));
    }

    function handleEnter(event) { if (event.key === "Enter") executeSearch(); }

    function executeSearch() {
        if(isCompareMode) resetMapState();
        const keyword = document.getElementById('search-input').value.trim();
        if (!keyword) {
            renderMap(rawData.filter(item => activeDistricts.has(item.district)));
            map.setFitView(null, false, [50, 50, 50, 400]); 
            return;
        }
        const results = rawData.filter(item => item.name.toLowerCase().includes(keyword.toLowerCase()));
        if (results.length === 0) { showStatus("⚠️ 未找到"); return; }
        renderMap(results);
        if (results.length === 1) {
            const target = results[0];
            const targetMarker = markers.find(m => m.getExtData().name === target.name);
            showStatus(`🔍 定位: ${target.name}`);
            map.setZoomAndCenter(17, [target.lng, target.lat]);
            setTimeout(() => { map.panBy(175, 0); showDetail(target); }, 150);
        } else {
            map.setFitView(null, false, [50, 50, 50, 400]);
        }
    }

    function renderMap(dataToRender) {
        map.clearMap();
        if (circleOverlay) { map.remove(circleOverlay); circleOverlay = null; }
        markers = [];
        
        const prices = dataToRender.map(d => d.pCurrent);
        const maxP = Math.max(...prices, 100); 
        const minP = Math.min(...prices, 50);

        dataToRender.forEach(item => {
            let color = '#999', label = '';

            // --- 可视化核心逻辑 ---
            if (currentMode === 'price') {
                const ratio = (item.pCurrent - minP) / (maxP - minP || 1);
                color = `hsl(${120 - Math.max(0,Math.min(1,ratio)) * 120}, 75%, 45%)`;
                label = '¥';
            } else if (currentMode === 'vacancy') {
                const ratio = Math.min(item.vCurrent / 0.3, 1);
                color = `hsl(${120 - ratio * 120}, 75%, 45%)`;
                label = '%';
            } else if (currentMode === 'grade') {
                // 等级：PA深蓝，A亮蓝，其他灰
                if (item.grade === 'PA') color = '#1a237e'; 
                else if (item.grade === 'A') color = '#2979ff';
                else color = '#b0bec5'; 
                label = 'G';
            } else if (currentMode === 'leed') {
                // LEED：Platinum深绿，Gold金，Silver银
                const l = item.leed.toLowerCase();
                if (l.includes('platinum')) color = '#004d40';
                else if (l.includes('gold')) color = '#fbc02d';
                else if (l.includes('silver')) color = '#9e9e9e';
                else if (l.includes('cert')) color = '#81c784';
                else color = '#eeeeee'; 
                label = 'L';
            }

            const zIndex = (currentMode === 'leed' && color === '#eeeeee') ? 50 : 100;
            const textColor = (color==='#fbc02d'||color==='#eeeeee') ? '#555' : 'white';

            const content = `<div style="width:26px; height:26px; background:${color}; border:2px solid white; border-radius:50%; box-shadow:0 3px 6px rgba(0,0,0,0.3); color:${textColor}; display:flex; justify-content:center; align-items:center; font-size:11px; font-weight:bold;">${label}</div>`;
            
            const marker = new AMap.Marker({
                position: [item.lng, item.lat], content: content, offset: new AMap.Pixel(-13, -13), map: map, zIndex: zIndex, extData: item 
            });
            marker.on('click', () => showDetail(item));
            markers.push(marker);
        });
        updateDashboard(dataToRender);
    }

    function findPlanB(targetItem) {
        isCompareMode = true;
        map.clearMap(); markers = [];
        const targetLngLat = new AMap.LngLat(targetItem.lng, targetItem.lat);
        
        const competitors = rawData.filter(item => {
            if (item.name === targetItem.name) return false;
            const itemLngLat = new AMap.LngLat(item.lng, item.lat);
            return targetLngLat.distance(itemLngLat) <= 1500 && item.pCurrent < targetItem.pCurrent;
        });

        const targetMarker = new AMap.Marker({
            position: targetLngLat,
            content: `<div style="width:34px;height:34px;background:#FFD700;border:3px solid #fff;border-radius:50%;box-shadow:0 0 15px rgba(255,215,0,0.6);display:flex;justify-content:center;align-items:center;font-size:20px;">⭐️</div>`,
            offset: new AMap.Pixel(-17, -17), map: map, zIndex: 999
        });
        targetMarker.on('click', () => showDetail(targetItem));

        competitors.forEach(item => {
            const priceDiff = (targetItem.pCurrent - item.pCurrent).toFixed(1);
            const content = `<div style="min-width:40px;padding:0 5px;height:24px;background:#2ecc71;border:2px solid white;border-radius:12px;box-shadow:0 3px 6px rgba(0,0,0,0.2);color:white;display:flex;justify-content:center;align-items:center;font-size:11px;font-weight:bold;">📉${priceDiff}</div>`;
            const marker = new AMap.Marker({ position: [item.lng, item.lat], content: content, offset: new AMap.Pixel(-20, -12), map: map, zIndex: 500 });
            marker.on('click', () => showDetail(item));
            markers.push(marker);
        });

        circleOverlay = new AMap.Circle({ center: targetLngLat, radius: 1500, borderWeight: 1, strokeColor: "#007AFF", strokeOpacity: 0.5, strokeWeight: 1, fillOpacity: 0.1, strokeStyle: 'dashed', strokeDasharray: [10, 10], fillColor: '#1791fc', zIndex: 50 });
        circleOverlay.setMap(map);

        map.setFitView(null, false, [50, 50, 50, 420]);
        document.getElementById('reset-map-btn').style.display = 'block';
        showStatus(`🎯 发现 ${competitors.length} 个更便宜的项目`);
        updateDashboard(competitors);
    }

    function resetMapState() {
        isCompareMode = false;
        document.getElementById('reset-map-btn').style.display = 'none';
        renderMap(rawData.filter(item => activeDistricts.has(item.district)));
        map.setFitView(null, false, [50, 50, 50, 400]);
    }

    function showDetail(item) {
        setTimeout(() => {
            const btn = document.getElementById('btn-plan-b');
            if(btn) btn.onclick = () => findPlanB(item);
        }, 0);

        // --- 生成不同颜色的标签 ---
        let gradeClass = 'badge-none';
        if (item.grade === 'PA') gradeClass = 'badge-pa';
        else if (item.grade === 'A') gradeClass = 'badge-a';
        else if (item.grade === 'B') gradeClass = 'badge-b';

        let leedClass = 'badge-none';
        const l = item.leed.toLowerCase();
        if (l.includes('platinum')) leedClass = 'badge-platinum';
        else if (l.includes('gold')) leedClass = 'badge-gold';
        else if (l.includes('silver')) leedClass = 'badge-silver';

        const gradeBadge = `<span class="badge ${gradeClass}">${item.grade === '-' ? '未知' : item.grade}</span>`;
        const leedBadge = `<span class="badge ${leedClass}">${item.leed === '无' ? '无LEED' : item.leed}</span>`;

        const content = `
            <div class="info-window-card">
                <div style="padding:15px; border-bottom:1px solid #eee;">
                    <h3 style="margin:0;font-size:18px;">${item.name}</h3>
                    <div style="color:#666;font-size:12px;margin-top:4px;">${item.district} | ${item.built_year}</div>
                    <div class="tag-row">${gradeBadge} ${leedBadge}</div>
                </div>
                <div style="display:flex;padding:15px;">
                    <div style="flex:1;">
                        <div style="font-size:12px;color:#888;">净有效租金</div>
                        <div style="font-size:20px;font-weight:bold;color:#333;">¥${item.pCurrent.toFixed(1)}</div>
                    </div>
                    <div style="text-align:right;">
                        <div style="font-size:12px;color:#888;">空置率</div>
                        <div style="font-size:20px;font-weight:bold;color:#333;">${(item.vCurrent*100).toFixed(1)}%</div>
                    </div>
                </div>
                <div style="padding:0 15px 15px;">
                    <div class="chart-container"><canvas id="trendChart"></canvas></div>
                    <button id="btn-plan-b" class="btn-plan-b">🔍 客户嫌贵？查看周边平替 (Plan B)</button>
                </div>
            </div>`;
        infoWindow.setContent(content);
        infoWindow.open(map, [item.lng, item.lat]);
        setTimeout(() => renderChart(item), 100);
    }

    function renderChart(item) {
        const ctx = document.getElementById('trendChart').getContext('2d');
        if(chartInstance) chartInstance.destroy();
        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: QUARTERS,
                datasets: [
                    { label:'租金', data:item.priceHistory, borderColor:'#004080', backgroundColor:'rgba(0,64,128,0.1)', fill:true, yAxisID:'y', tension:0 },
                    { label:'空置%', data:item.vacancyHistory.map(v=>v*100), borderColor:'#dc3545', borderDash:[5,5], yAxisID:'y1', tension:0 }
                ]
            },
            options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ x:{grid:{display:false},ticks:{font:{size:9}}}, y:{type:'linear',display:true,position:'left'}, y1:{type:'linear',display:true,position:'right',grid:{drawOnChartArea:false}} } }
        });
    }

    function updateDashboard(data) {
        const count = data.length;
        document.getElementById('stat-count').innerText = count;
        document.getElementById('stat-price').innerText = count ? (data.reduce((a,b)=>a+b.pCurrent,0)/count).toFixed(2) : '-';
        document.getElementById('stat-vacancy').innerText = count ? ((data.reduce((a,b)=>a+b.vCurrent,0)/count)*100).toFixed(1)+'%' : '-';
        
        // 统计 Grade A (包括 PA 和 A)
        const gradeACount = data.filter(d => d.grade === 'A' || d.grade === 'PA').length;
        const gradeARate = count ? ((gradeACount / count) * 100).toFixed(0) : 0;
        document.getElementById('stat-grade').innerText = gradeARate + '%';
        
        // 统计 LEED (有值的都算)
        const leedCount = data.filter(d => d.leed !== '无' && d.leed !== '').length;
        document.getElementById('stat-leed').innerText = leedCount;
    }

    function showStatus(msg) {
        const el = document.getElementById('status-bar');
        el.innerText = msg; el.style.display = 'block';
    }

    function setMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.btn-mode').forEach(btn => btn.classList.remove('active'));
        event.currentTarget.classList.add('active');
        if(!isCompareMode) {
            const keyword = document.getElementById('search-input').value.trim();
            if(keyword) executeSearch(); 
            else renderMap(rawData.filter(item => activeDistricts.has(item.district)));
        }
    }

    init();
</script>
</body>
</html>
