<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高力国际 | 办公楼数据驾驶舱</title>
    
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script type="text/javascript">
        window._AMapSecurityConfig = {
            securityJsCode: '你的安全密钥', // 【请替换你的安全密钥】
        }
    </script>
    <script src="https://webapi.amap.com/maps?v=2.0&key=31fdd14ad134becab8cb33119fa019d5"></script>
    
    <style>
        /* --- 布局样式 --- */
        body { margin: 0; padding: 0; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; overflow: hidden; display: flex; height: 100vh; }
        
        /* 左侧边栏 (Dashboard) */
        #sidebar {
            width: 320px;
            background: #f8f9fa;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            z-index: 200;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
        }
        
        /* 顶部品牌区 */
        .brand-header {
            padding: 20px;
            background: #004080; /* Colliers Blue */
            color: white;
        }
        .brand-header h2 { margin: 0; font-size: 18px; letter-spacing: 1px; }
        .brand-header p { margin: 5px 0 0; opacity: 0.8; font-size: 12px; }

        /* 统计卡片区 */
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 15px;
            background: white;
            border-bottom: 1px solid #eee;
        }
        .stat-card { text-align: center; }
        .stat-value { font-size: 20px; font-weight: bold; color: #004080; }
        .stat-label { font-size: 12px; color: #666; }

        /* 筛选控制区 */
        .controls { flex: 1; padding: 20px; overflow-y: auto; }
        .control-group { margin-bottom: 25px; }
        .control-title { font-weight: bold; font-size: 14px; margin-bottom: 10px; display: block; color: #333; }
        
        /* 复选框样式 */
        .checkbox-group label {
            display: flex; align-items: center; margin-bottom: 8px; font-size: 13px; color: #555; cursor: pointer;
        }
        .checkbox-group input { margin-right: 8px; }

        /* 搜索框 (嵌入侧边栏) */
        #search-input {
            width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 20px;
        }

        /* 底部操作区 */
        .actions { padding: 15px; border-top: 1px solid #eee; background: white; }
        .btn-mode {
            width: 100%; padding: 10px; margin-bottom: 10px;
            border: 1px solid #004080; background: white; color: #004080;
            border-radius: 4px; cursor: pointer; font-weight: bold;
            transition: all 0.2s;
        }
        .btn-mode.active { background: #004080; color: white; }

        /* 右侧地图容器 */
        #map-container { flex: 1; position: relative; }
        
        /* 弹窗样式优化 */
        .info-window-card { width: 320px; padding: 0; }
        .chart-container { height: 180px; width: 100%; margin-top: 10px; }
        .trend-tag { 
            display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 12px; margin-left: 5px; 
        }
        .trend-up { background: #ffebee; color: #c62828; } /* 涨红 */
        .trend-down { background: #e8f5e9; color: #2e7d32; } /* 跌绿 */

    </style>
</head>
<body>

    <div id="sidebar">
        <div class="brand-header">
            <h2>COLLIERS DATA</h2>
            <p>办公楼市场监测系统 v2.0</p>
        </div>

        <div class="stat-grid">
            <div class="stat-card">
                <div class="stat-value" id="stat-count">-</div>
                <div class="stat-label">监测项目 (个)</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-price">-</div>
                <div class="stat-label">平均租金 (元)</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-vacancy">-</div>
                <div class="stat-label">平均空置 (%)</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-qoq">-</div>
                <div class="stat-label">环比涨幅</div>
            </div>
        </div>

        <div class="controls">
            <input type="text" id="search-input" placeholder="输入楼宇名称快速定位..." onkeyup="handleSearch()">
            
            <div class="control-group">
                <span class="control-title">商圈筛选</span>
                <div class="checkbox-group" id="district-filters">
                    <label><input type="checkbox" checked disabled> 加载中...</label>
                </div>
            </div>
        </div>

        <div class="actions">
            <span class="control-title" style="margin-bottom:10px; display:block">着色模式</span>
            <button class="btn-mode active" onclick="setMode('price')">💰 按租金热力着色</button>
            <button class="btn-mode" onclick="setMode('vacancy')">🏢 按空置率着色</button>
        </div>
    </div>

    <div id="map-container"></div>

<script>
    // --- 配置与全局变量 ---
    // 定义时间轴 (对应 Excel 列名: price_2023_Q1, etc.)
    const QUARTERS = ['2023_Q1', '2023_Q2', '2023_Q3', '2023_Q4', '2024_Q1', '2024_Q2'];
    const LATEST_Q = '2024_Q2';
    const PREV_Q = '2024_Q1';

    let map;
    let rawData = []; // 原始数据
    let markers = []; // 地图标记对象
    let infoWindow;
    let chartInstance = null; // 图表实例
    let currentMode = 'price'; // 当前模式: 'price' 或 'vacancy'
    let activeDistricts = new Set(); // 当前选中的商圈

    // --- 1. 初始化 ---
    function init() {
        map = new AMap.Map('map-container', {
            zoom: 12,
            center: [116.460787, 39.905477], // 北京CBD
            viewMode: '2D',
            mapStyle: 'amap://styles/whitesmoke' // 使用浅色地图突显数据点
        });

        infoWindow = new AMap.InfoWindow({
            isCustom: false,
            offset: new AMap.Pixel(0, -35),
            autoMove: true
        });

        // 监听弹窗关闭，销毁图表防止内存泄漏
        infoWindow.on('close', () => {
            if(chartInstance) { chartInstance.destroy(); chartInstance = null; }
        });

        loadExcel();
    }

    // --- 2. 加载与处理数据 ---
    async function loadExcel() {
        try {
            const response = await fetch('./data.xlsx'); // 请确保文件名匹配
            const buffer = await response.arrayBuffer();
            const workbook = XLSX.read(buffer);
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const json = XLSX.utils.sheet_to_json(sheet);

            // 数据清洗与增强
            rawData = json.map(item => {
                const posStr = String(item.position || "").trim();
                const pos = posStr.split(',').map(Number);
                
                // 计算环比 (QoQ)
                const pCurrent = item[`price_${LATEST_Q}`] || 0;
                const pPrev = item[`price_${PREV_Q}`] || 0;
                const qoq = pPrev > 0 ? ((pCurrent - pPrev) / pPrev) : 0;

                return {
                    ...item,
                    lat: pos[1],
                    lng: pos[0],
                    isValid: (pos.length === 2 && !isNaN(pos[0])),
                    qoq: qoq,
                    // 提取历史数组用于画图
                    priceHistory: QUARTERS.map(q => item[`price_${q}`] || 0),
                    vacancyHistory: QUARTERS.map(q => item[`vacancy_${q}`] || 0)
                };
            }).filter(d => d.isValid);

            initFilters();
            renderMap();
            updateDashboard();

        } catch (err) {
            alert("数据加载失败，请检查 data.xlsx 是否存在且格式正确。");
            console.error(err);
        }
    }

    // --- 3. 过滤器初始化 ---
    function initFilters() {
        // 提取所有唯一商圈
        const districts = [...new Set(rawData.map(d => d.district))].filter(Boolean);
        districts.forEach(d => activeDistricts.add(d)); // 默认全选

        const container = document.getElementById('district-filters');
        container.innerHTML = districts.map(d => `
            <label>
                <input type="checkbox" value="${d}" checked onchange="toggleDistrict('${d}')">
                ${d}
            </label>
        `).join('');
    }

    function toggleDistrict(d) {
        if (activeDistricts.has(d)) activeDistricts.delete(d);
        else activeDistricts.add(d);
        renderMap(); // 重绘地图
        updateDashboard(); // 更新统计
    }

    function handleSearch() {
        const keyword = document.getElementById('search-input').value.toLowerCase();
        // 简单实现：只显示搜索匹配的，或者高亮。这里我们配合筛选逻辑。
        // 为了简单，我们只在点击回车或输入时过滤显示的 Marker
        renderMap(keyword);
    }

    // --- 4. 渲染地图点 (核心逻辑) ---
    function renderMap(searchKeyword = "") {
        map.clearMap();
        markers = [];

        // 1. 过滤数据
        const visibleData = rawData.filter(item => {
            const matchDistrict = activeDistricts.has(item.district);
            const matchSearch = item.name.toLowerCase().includes(searchKeyword);
            return matchDistrict && matchSearch;
        });

        // 2. 计算当前视图数据的最大最小值（用于颜色映射）
        const prices = visibleData.map(d => d[`price_${LATEST_Q}`]);
        const maxPrice = Math.max(...prices, 15); // 设个保底值防止报错
        const minPrice = Math.min(...prices, 5);

        visibleData.forEach(item => {
            // 根据模式决定颜色
            let color = '#007AFF'; // 默认蓝
            let scale = 1.0;
            
            if (currentMode === 'price') {
                const val = item[`price_${LATEST_Q}`];
                // 价格越高越红，越低越绿 (简单插值)
                // 使用 HSL: 0(红) -> 120(绿)。价格高(max) -> 0, 价格低(min) -> 120
                const ratio = (val - minPrice) / (maxPrice - minPrice + 0.1);
                const hue = (1 - ratio) * 120; // 这里的逻辑反了，通常红色代表贵(Hot)
                // 修正：Red(0) is Hot/Expensive, Green(120) is Cheap. 
                // ratio 0(cheap) -> hue 120. ratio 1(expensive) -> hue 0.
                color = `hsl(${120 - (ratio * 120)}, 70%, 50%)`;
            } else {
                // 空置率模式：高空置(红色警报), 低空置(绿色)
                const vac = item[`vacancy_${LATEST_Q}`];
                // 假设 0% 是绿，30% 是红
                const ratio = Math.min(vac / 0.3, 1); 
                color = `hsl(${120 - (ratio * 120)}, 70%, 50%)`;
            }

            // 创建圆点标记 (比图标更适合数据可视化)
            const markerContent = `
                <div style="
                    width: 24px; height: 24px; 
                    background-color: ${color}; 
                    border: 2px solid white; 
                    border-radius: 50%; 
                    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
                    display: flex; justify-content: center; align-items: center;
                    color: white; font-size: 10px; font-weight: bold;">
                    ${currentMode === 'price' ? '￥' : '%'}
                </div>
            `;

            const marker = new AMap.Marker({
                position: [item.lng, item.lat],
                content: markerContent,
                offset: new AMap.Pixel(-12, -12),
                map: map,
                extData: item // 存入数据以便后续使用
            });

            marker.on('click', () => showDetail(item));
            markers.push(marker);
        });
        
        // 更新统计
        updateDashboard(visibleData);
    }

    // --- 5. 详情弹窗与图表 ---
    function showDetail(item) {
        const currentPrice = item[`price_${LATEST_Q}`].toFixed(1);
        const currentVac = (item[`vacancy_${LATEST_Q}`] * 100).toFixed(1);
        const qoqPct = (item.qoq * 100).toFixed(1);
        const trendClass = item.qoq >= 0 ? 'trend-up' : 'trend-down';
        const trendIcon = item.qoq >= 0 ? '📈' : '📉';

        const content = `
            <div class="info-window-card" style="padding:10px;">
                <h3 style="margin:0 0 10px 0; border-bottom:1px solid #eee; padding-bottom:10px;">
                    ${item.name} <span style="font-size:12px; color:#999; font-weight:normal">(${item.built_year}年)</span>
                </h3>
                <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:10px;">
                    <div>
                        <div style="color:#666">最新租金</div>
                        <div style="font-size:18px; font-weight:bold; color:#333">
                            ¥${currentPrice} 
                            <span class="trend-tag ${trendClass}">${trendIcon} ${qoqPct}%</span>
                        </div>
                    </div>
                    <div style="text-align:right">
                        <div style="color:#666">空置率</div>
                        <div style="font-size:18px; font-weight:bold; color:#333">${currentVac}%</div>
                    </div>
                </div>
                <div class="chart-container">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>
        `;
        
        infoWindow.setContent(content);
        infoWindow.open(map, [item.lng, item.lat]);

        // 等待DOM渲染后绘制图表
        setTimeout(() => {
            renderChart(item);
        }, 100);
    }

    function renderChart(item) {
        const ctx = document.getElementById('trendChart').getContext('2d');
        
        // 销毁旧图表
        if(chartInstance) chartInstance.destroy();

        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['23Q1', '23Q2', '23Q3', '23Q4', '24Q1', '24Q2'],
                datasets: [
                    {
                        label: '租金走势 (元/㎡/天)',
                        data: item.priceHistory,
                        borderColor: '#004080',
                        backgroundColor: 'rgba(0, 64, 128, 0.1)',
                        fill: true,
                        tension: 0.4, // 平滑曲线
                        yAxisID: 'y'
                    },
                    {
                        label: '空置率 (%)',
                        data: item.vacancyHistory.map(v => v * 100),
                        borderColor: '#dc3545',
                        borderDash: [5, 5],
                        tension: 0.4,
                        yAxisID: 'y1'
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                plugins: { legend: { position: 'bottom', labels:{boxWidth:10} } },
                scales: {
                    y: { 
                        type: 'linear', display: true, position: 'left',
                        title: {display: true, text: '租金'} 
                    },
                    y1: { 
                        type: 'linear', display: true, position: 'right',
                        grid: { drawOnChartArea: false }, // 不显示右侧网格线
                        title: {display: true, text: '空置%'}
                    }
                }
            }
        });
    }

    // --- 6. 仪表盘更新 ---
    function updateDashboard(data) {
        if (!data) return; // 初始加载跳过
        
        // 计算均值
        const count = data.length;
        const totalPrice = data.reduce((acc, cur) => acc + cur[`price_${LATEST_Q}`], 0);
        const totalVac = data.reduce((acc, cur) => acc + cur[`vacancy_${LATEST_Q}`], 0);
        
        // 计算整体环比
        const totalQoQ = data.reduce((acc, cur) => acc + cur.qoq, 0);

        document.getElementById('stat-count').innerText = count;
        document.getElementById('stat-price').innerText = count ? (totalPrice / count).toFixed(2) : '-';
        document.getElementById('stat-vacancy').innerText = count ? ((totalVac / count) * 100).toFixed(1) + '%' : '-';
        
        const avgQoQ = count ? (totalQoQ / count * 100) : 0;
        const qoqEl = document.getElementById('stat-qoq');
        qoqEl.innerText = (avgQoQ > 0 ? '+' : '') + avgQoQ.toFixed(2) + '%';
        qoqEl.style.color = avgQoQ >= 0 ? '#c62828' : '#2e7d32';
    }

    // --- 7. 模式切换 ---
    function setMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.btn-mode').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        renderMap(); // 重新着色
    }

    // 启动
    init();

</script>
</body>
</html>
