<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高力国际 | 办公楼市场监测系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 商务扁平化 & 100vh 锁屏布局 */
        body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: #f4f6f9; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; color: #333; }

        /* 登录框 */
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 62, 126, 0.95); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; padding: 35px; border-radius: 4px; width: 300px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); text-align: center; }
        .login-box h2 { margin: 0 0 15px 0; color: #003E7E; font-size: 22px; letter-spacing: 1px; }
        .login-input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 2px; box-sizing: border-box; font-size: 13px; outline: none; }
        .login-input:focus { border-color: #003E7E; }
        .login-btn { width: 100%; padding: 10px; background: #003E7E; color: white; border: none; border-radius: 2px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; }
        .login-btn:hover { background: #002b5e; }
        .login-error { color: #d32f2f; font-size: 12px; margin-top: 10px; display: none; }

        /* 顶部导航 */
        .header { background: #003E7E; color: white; padding: 0 25px; height: 50px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .header h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: 0.5px; }
        .user-info { font-size: 12px; display: flex; gap: 15px; align-items: center; }
        .logout-btn { color: #e0e0e0; cursor: pointer; transition: 0.2s; }
        .logout-btn:hover { color: white; }

        /* 主内容区 */
        .main-content { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 20px; overflow: hidden; }
        .welcome-text { font-size: 13px; color: #555; margin-bottom: 20px; flex-shrink: 0; }

        /* 导航卡片 */
        .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 850px; width: 100%; margin-bottom: 20px; flex-shrink: 0; }
        .nav-card { background: white; padding: 20px 15px; border-radius: 4px; text-align: center; text-decoration: none; color: #333; border: 1px solid #e0e0e0; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .nav-card:hover { transform: translateY(-2px); border-color: #003E7E; box-shadow: 0 4px 12px rgba(0,62,126,0.08); }
        .icon-box { font-size: 28px; color: #003E7E; }
        .card-title { font-size: 14px; font-weight: 600; }
        .nav-card.disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; background: #fafafa; }

        /* 留言墙升级 (加入全屏样式) */
        .msg-wall { flex: 1; min-height: 0; width: 100%; max-width: 850px; background: white; border-radius: 4px; border: 1px solid #e0e0e0; display: flex; flex-direction: column; overflow: hidden; transition: all 0.3s ease; }

        /* 激活全屏时的样式 */
        .msg-wall.fullscreen { position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; max-width: 100% !important; border-radius: 0 !important; z-index: 100000 !important; border: none !important; }

        .msg-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background: #fcfcfc; border-bottom: 1px solid #eee; flex-shrink: 0; }
        .msg-header h3 { margin: 0; font-size: 14px; color: #003E7E; }
        .expand-btn { cursor: pointer; color: #003E7E; font-size: 16px; transition: 0.2s; padding: 4px; }
        .expand-btn:hover { color: #f57f17; transform: scale(1.1); }

        .msg-list { flex: 1; overflow-y: auto; padding: 15px; background: #fff; }
        .msg-item { background: #f8f9fa; padding: 10px; border-radius: 2px; margin-bottom: 8px; border-left: 3px solid #003E7E; font-size: 12px; }
        .msg-info { font-size: 11px; color: #888; margin-bottom: 4px; }
        .msg-content { color: #222; word-break: break-all; line-height: 1.4; white-space: pre-wrap; }

        .msg-input-group { display: flex; padding: 10px 15px; background: #fcfcfc; border-top: 1px solid #eee; flex-shrink: 0; }
        .msg-input-group input { flex: 1; padding: 10px 12px; border: 1px solid #ccc; border-radius: 2px 0 0 2px; font-size: 13px; outline: none; }
        .msg-input-group input:focus { border-color: #003E7E; }
        .msg-input-group button { background: #003E7E; color: white; border: none; padding: 0 25px; border-radius: 0 2px 2px 0; cursor: pointer; font-size: 13px; font-weight: bold; }

        /* ★ 修改点：吸底公告栏彻底改为多行自适应布局 */
        .notice-bar { background: #fffde7; color: #f57f17; padding: 12px 20px; display: flex; align-items: flex-start; border-top: 1px solid #fff59d; flex-shrink: 0; font-size: 13px; }
        .notice-title { font-weight: bold; margin-right: 15px; white-space: nowrap; margin-top: 2px; }
        .notice-content { flex: 1; display: flex; flex-direction: column; gap: 6px; color: #d32f2f; font-weight: 500; }
        .notice-line { line-height: 1.4; word-break: break-all; }
        #admin-settings-btn { display: none; margin-left: 15px; background: #003E7E; color: white; border: none; padding: 4px 10px; border-radius: 2px; cursor: pointer; font-size: 11px; margin-top: 2px; }

        /* 模态框 */
        #pwd-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 10000; justify-content: center; align-items: center; }
        .pwd-box { background: white; padding: 25px; border-radius: 4px; width: 280px; text-align: center; }
        .pwd-box h3 { margin-top: 0; font-size: 16px; color: #003E7E; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn-group button { flex: 1; padding: 8px; border-radius: 2px; cursor: pointer; font-size: 12px; }
        .btn-cancel { border: 1px solid #ccc; background: #f9f9f9; color: #333; }
        .btn-confirm { border: none; background: #003E7E; color: white; font-weight: bold; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-box">
        <h2>COLLIERS DATA</h2>
        <p style="color:#666; font-size:12px; margin-bottom:20px;">内部数据系统门户 (SSO)</p>
        <input type="text" id="login-name" class="login-input" placeholder="邮箱 (例如: cassie.gao@colliers.com)">
        <input type="text" id="login-phone" class="login-input" placeholder="手机号">
        <input type="password" id="login-pwd" class="login-input" placeholder="密码 (内部号码, 如 COS1234)">
        <button class="login-btn" onclick="handleLogin()">认证进入</button>
        <div id="login-msg" class="login-error"></div>
    </div>
</div>

<div id="pwd-modal">
    <div class="pwd-box">
        <h3>修改密码</h3>
        <input type="text" id="cp-name" class="login-input" readonly style="background:#f5f5f5;">
        <input type="text" id="cp-id" class="login-input" placeholder="输入手机号验证">
        <input type="password" id="cp-old" class="login-input" placeholder="原密码 (内部号码)">
        <input type="password" id="cp-new" class="login-input" placeholder="新密码 (最少6位)">
        <div class="btn-group">
            <button class="btn-cancel" onclick="closePwdModal()">取消</button>
            <button class="btn-confirm" onclick="submitChangePwd()">确认</button>
        </div>
        <div id="pwd-msg" class="login-error"></div>
    </div>
</div>

<div class="header">
    <h1>高力国际内部数据平台</h1>
    <div class="user-info">
        <span id="user-display"></span>
        <span class="logout-btn" onclick="openPwdModal()">修改密码</span>
        <span class="logout-btn" onclick="logout()">退出登录</span>
    </div>
</div>

<div class="main-content">
    <div class="welcome-text">欢迎使用数据终端，请选择业务模块。</div>

    <div class="grid-container">
        <a href="map.html" class="nav-card">
            <div class="icon-box"><i class="fas fa-map-marked-alt"></i></div>
            <div class="card-title">项目地图系统</div>
        </a>
        <a href="reports.html" class="nav-card">
            <div class="icon-box"><i class="fas fa-newspaper"></i></div>
            <div class="card-title">云端资料库</div>
        </a>
        <a href="update.html" class="nav-card" id="btn-data-collect">
            <div class="icon-box"><i class="fas fa-chart-line"></i></div>
            <div class="card-title">季度数据填报</div>
        </a>
    </div>

    <div class="msg-wall" id="msg-wall">
        <div class="msg-header">
            <h3><i class="fas fa-comment-dots"></i> 业务交流板</h3>
            <i class="fas fa-expand expand-btn" id="expand-icon" onclick="toggleFullscreen()" title="全屏放大"></i>
        </div>
        <div id="msg-list" class="msg-list">
            <p style="color:#999; font-size:12px; text-align:center; padding:20px;">正在同步数据...</p>
        </div>
        <div class="msg-input-group">
            <input type="text" id="new-msg" placeholder="输入留言 (支持长文本)..." maxlength="1000" onkeydown="if(event.key==='Enter') postMessage()">
            <button id="btn-send-msg" onclick="postMessage()">发送</button>
        </div>
    </div>
</div>

<div class="notice-bar">
    <div class="notice-title">📢 公告</div>
    <div class="notice-content" id="notice-content">
        <div class="notice-line">加载中...</div>
    </div>
    <button id="admin-settings-btn" onclick="window.location.href='admin.html'">后台管理</button>
</div>

<script>
    let currentUser = null;

    window.onload = function() {
        const cachedUser = localStorage.getItem('colliers_user');
        const cachedToken = localStorage.getItem('colliers_token'); 
        if (cachedUser && cachedToken) {
            currentUser = JSON.parse(cachedUser);
            loginSuccess(currentUser);
        }
        loadNotice(); 
    };

    function toggleFullscreen() {
        const wall = document.getElementById('msg-wall');
        const icon = document.getElementById('expand-icon');

        wall.classList.toggle('fullscreen');

        if (wall.classList.contains('fullscreen')) {
            icon.classList.remove('fa-expand');
            icon.classList.add('fa-compress'); 
        } else {
            icon.classList.remove('fa-compress');
            icon.classList.add('fa-expand'); 
        }

        const list = document.getElementById('msg-list');
        list.scrollTo({ top: list.scrollHeight, behavior: 'smooth' });
    }

    async function handleLogin() {
        const name = document.getElementById('login-name').value.trim();
        const phone = document.getElementById('login-phone').value.trim();
        const password = document.getElementById('login-pwd').value.trim();
        const msg = document.getElementById('login-msg');

        if (!name || !phone || !password) { msg.innerText = "请填写完整"; msg.style.display = 'block'; return; }
        const btn = document.querySelector('.login-btn'); btn.innerText = "认证中...";

        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, id: phone, phone: phone, password: password })
            });
            const data = await res.json();
            if (data.status === 'success') {
                currentUser = data.data; 
                localStorage.setItem('colliers_user', JSON.stringify(data.data));
                localStorage.setItem('colliers_token', data.token); 
                loginSuccess(data.data);
            } else { msg.innerText = data.message || "失败"; msg.style.display = 'block'; }
        } catch (e) { msg.innerText = "网络错误"; msg.style.display = 'block'; }
        finally { btn.innerText = "认证进入"; }
    }

    function loginSuccess(user) {
        currentUser = user;
        document.getElementById('login-overlay').style.display = 'none';

        const displayName = user.fullName || user.name;
        document.getElementById('user-display').innerText = `${displayName} (${user.role})`;

        if (user.role === 'viewer') document.getElementById('btn-data-collect').classList.add('disabled');
        if (user.role === 'admin') document.getElementById('admin-settings-btn').style.display = 'block';

        startHeartbeat();
        loadMessages(); 
    }

    function logout() { localStorage.clear(); location.reload(); }

    // ★ 修改点：智能解析并强制生成独立行的 HTML 结构
    async function loadNotice() {
        try {
            const res = await fetch(`/api/portal?action=get-notice&_t=${Date.now()}`);
            const data = await res.json();
            
            let finalHtml = '<div class="notice-line">欢迎使用系统！</div>';
            if (data.status === 'success' && data.text) {
                try {
                    // 如果后端存的是数组格式，将其解构成多个 div 行
                    const notices = JSON.parse(data.text);
                    if (Array.isArray(notices) && notices.length > 0) {
                        finalHtml = notices.map(n => `<div class="notice-line">🔹 ${n}</div>`).join('');
                    } else {
                        finalHtml = `<div class="notice-line">🔹 ${data.text}</div>`;
                    }
                } catch(e) {
                    // 如果解析 JSON 失败（兼容之前存的纯文本），直接单行显示
                    finalHtml = `<div class="notice-line">🔹 ${data.text}</div>`;
                }
            }
            document.getElementById('notice-content').innerHTML = finalHtml;
        } catch (e) { document.getElementById('notice-content').innerHTML = '<div class="notice-line">系统运行中</div>'; }
    }

    async function loadMessages() {
        const list = document.getElementById('msg-list');
        try {
            const res = await fetch(`/api/portal?action=get-messages&_t=${Date.now()}`);
            const msgs = await res.json();
            if (!Array.isArray(msgs) || msgs.length === 0) { 
                list.innerHTML = '<p style="color:#999; font-size:12px; text-align:center; padding:20px;">暂无留言</p>'; return; 
            }
            list.innerHTML = msgs.map(m => `
                <div class="msg-item">
                    <div class="msg-info"><strong>${m.user}</strong> · ${m.time}</div>
                    <div class="msg-content">${m.text}</div>
                </div>
            `).join('');
            list.scrollTo({ top: list.scrollHeight, behavior: 'smooth' });
        } catch (e) { list.innerHTML = '<p style="color:red; font-size:12px; text-align:center;">加载异常</p>'; }
    }

    async function postMessage() {
        const input = document.getElementById('new-msg');
        const text = input.value.trim();
        if (!text) return; 

        if (!currentUser) {
            alert("登录状态异常，请刷新页面重新登录");
            return;
        }

        const btn = document.getElementById('btn-send-msg');
        btn.disabled = true; btn.innerText = "...";

        const sendName = currentUser.fullName || currentUser.name;

        try {
            const res = await fetch('/api/portal?action=post-message', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user: sendName, text: text })
            });

            const data = await res.json();
            if (data.status === 'success') { 
                input.value = ''; 
                await loadMessages(); 
            } else {
                alert("发送失败: " + (data.message || '未知错误'));
            }
        } catch (e) { 
            console.error("发送留言出错: ", e);
            alert("网络连接异常，发送失败。");
        } finally { 
            btn.disabled = false; btn.innerText = "发送"; 
        }
    }

    function startHeartbeat() {
        setInterval(async () => {
            const userStr = localStorage.getItem('colliers_user');
            const token = localStorage.getItem('colliers_token');
            if (!userStr || !token) return;
            const user = JSON.parse(userStr);
            try {
                const res = await fetch('/api/login?action=check', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: user.name, token: token })
                });
                if ((await res.json()).status === 'invalid') { logout(); alert("账号已在别处登录。"); }
            } catch (e) { }
        }, 60000);
    }

    function openPwdModal() { document.getElementById('pwd-modal').style.display = 'flex'; document.getElementById('cp-name').value = JSON.parse(localStorage.getItem('colliers_user')).name; }
    function closePwdModal() { document.getElementById('pwd-modal').style.display = 'none'; }
    async function submitChangePwd() {
        const id = document.getElementById('cp-id').value.trim(), oldPwd = document.getElementById('cp-old').value.trim(), newPwd = document.getElementById('cp-new').value.trim(), msg = document.getElementById('pwd-msg');
        if(!id || !oldPwd || !newPwd) { msg.innerText = "请填满所有字段"; msg.style.display='block'; return; }
        try {
            const res = await fetch('/api/login?action=change-pwd', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: document.getElementById('cp-name').value, id, oldPwd, newPwd }) });
            const data = await res.json();
            if(data.status === 'success') { alert("修改成功，请重登"); logout(); } else { msg.innerText = data.message; msg.style.display='block'; }
        } catch(e) { msg.innerText = "修改失败"; msg.style.display='block'; }
    }
</script>
</body>
</html>
